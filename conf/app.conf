appname = ${APP_NAME||imagenes_service}
httpport = ${APP_PORT||8000}
runmode = ${RUNMODE||prod}
debug = ${DEBUG||false}
autorender = false

# Amazon Rekognition para validación de rostros
rekognition_min_face_confidence = ${REKOGNITION_MIN_FACE_CONFIDENCE||90}
rekognition_max_image_size_mb = ${REKOGNITION_MAX_IMAGE_SIZE_MB||5}

copyrequestbody = true
